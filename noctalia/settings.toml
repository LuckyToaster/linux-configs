config_version = 16

[bar.default]
enabled = false
end = [ "group:g2", "group:g1", "battery", "session" ]
margin_ends = 0
radius = 0
shadow = false
start = [ "workspaces" ]
widget_spacing = 12

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_container"
    id = "g1"
    members = [ "volume", "brightness" ]
    opacity = 1.0
    padding = 6.0

    [[bar.default.capsule_group]]
    accordion = false
    accordion_direction = "end"
    enabled = true
    fill = "surface_container"
    id = "g2"
    members = [ "network", "bluetooth" ]
    opacity = 1.0
    padding = 6.0

[battery]
warning_threshold = 20

[control_center]
hidden_tabs = [ "notifications", "screen-time" ]
sidebar = "full"
width = 800

    [[control_center.shortcuts]]
    type = "nightlight"

    [[control_center.shortcuts]]
    type = "keyboard_layout"

    [[control_center.shortcuts]]
    type = "mic_mute"

    [[control_center.shortcuts]]
    type = "power_profile"

    [[control_center.shortcuts]]
    type = "session"

[desktop_widgets]
enabled = false
